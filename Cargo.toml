[package]
name = "copyleaks"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Copyleaks is the integrity layer for your tech stack that helps organizations and individuals understand what's human-made and original, AI-generated, or manipulated across text, image, audio and video."
license = "MIT"
repository = "https://github.com/Copyleaks/copyleaks-rust"
readme = "README.md"
keywords = ["copyleaks", "ai-detection", "plagiarism", "grammar", "moderation"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
